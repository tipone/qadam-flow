# Qadam Flow worker.
# Installed to /etc/qadam-flow/worker.conf, read by systemd via
# EnvironmentFile=. This is systemd's format, not dotenv: no `export`,
# no inline comments, no ${VAR} expansion.

# --- process ---
AP_CONTAINER_TYPE=WORKER
# Health server only. Must differ from the API's AP_PORT on the same host.
AP_PORT=3001

# --- connection to the API ---
# Base URL only; the worker appends /api/ and /api/socket.io itself.
# Point this at the API VM when the worker runs on another host.
AP_WORKER_API_URL=http://127.0.0.1:3000
# Minted from AP_JWT_SECRET, see INSTALL.md. The API verifies it.
AP_WORKER_TOKEN=CHANGE_ME

# --- worker group (optional, SANDBOX modes only) ---
# Pins this worker to a named group: the same value is bound into the
# minted AP_WORKER_TOKEN (worker postinst / qadam-flow-mint-worker-token)
# and the API routes this worker's jobs through it. A group additionally
# requires, on THIS unit:
#   AP_EXECUTION_MODE=SANDBOX_PROCESS (or SANDBOX_CODE_AND_PROCESS)
#   AP_REUSE_SANDBOX=true|false
#AP_WORKER_GROUP_ID=my-group

# --- capacity ---
AP_WORKER_CONCURRENCY=5
AP_WORKER_SHUTDOWN_GRACE_SECONDS=60
# Set to false on a host that cannot hold one engine (~100 MB) per slot at boot.
AP_WORKER_PREWARM_ENGINES=true

# --- execution ---
# Must match the API's value. UNSANDBOXED runs Code steps with this
# process's privileges; use SANDBOX_CODE_ONLY for untrusted users.
AP_EXECUTION_MODE=UNSANDBOXED
# STRICT is the hardened option; it needs the egress proxy configured.
AP_NETWORK_MODE=UNRESTRICTED
AP_QADAM_VERSION_STORE_PATH=/var/lib/qadam-flow/qadam-versions

# --- logging ---
AP_LOG_LEVEL=info
AP_LOG_PRETTY=false
